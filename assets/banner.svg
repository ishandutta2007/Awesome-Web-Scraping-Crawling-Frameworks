<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }

    /* Subtle background dynamic pulses */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes crawlFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { r: 5; opacity: 0.6; }
      50% { r: 8; opacity: 1; }
    }

    .pulsing-orb-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 1050px 100px;
    }
    .pulsing-orb-2 {
      animation: pulseGlow 9s ease-in-out infinite 3s;
      transform-origin: 150px 260px;
    }
    .crawl-line {
      stroke-dasharray: 8 6;
      animation: crawlFlow 15s linear infinite;
    }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 2s; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 4s; }
    .dynamic-node { animation: nodePulse 3s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>

  <!-- Background Dynamic Ambient Orbs -->
  <circle class="pulsing-orb-1" cx="1050" cy="100" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle class="pulsing-orb-2" cx="150" cy="270" r="160" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="260" r="100" fill="#ec4899" opacity="0.08" filter="url(#glow)"/>

  <!-- Network / Crawler Dynamic Background Pathways -->
  <g opacity="0.45">
    <path class="crawl-line" d="M 800,280 C 880,220 920,300 1020,240 S 1100,160 1150,190" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="crawl-line" d="M 850,70 C 930,120 970,50 1060,110 S 1130,80 1180,130" fill="none" stroke="#a855f7" stroke-width="2" style="animation-duration: 20s;"/>
    <path class="crawl-line" d="M 750,170 C 840,150 890,210 990,160 S 1080,220 1160,180" fill="none" stroke="#6366f1" stroke-width="1.5" style="animation-duration: 12s;"/>

    <!-- Network Nodes -->
    <circle class="dynamic-node" cx="800" cy="280" r="5" fill="#38bdf8" filter="url(#nodeGlow)"/>
    <circle class="dynamic-node" cx="1020" cy="240" r="6" fill="#818cf8" filter="url(#nodeGlow)" style="animation-delay: 1s;"/>
    <circle class="dynamic-node" cx="1150" cy="190" r="5" fill="#c084fc" filter="url(#nodeGlow)" style="animation-delay: 2s;"/>
    <circle class="dynamic-node" cx="850" cy="70" r="5" fill="#a855f7" filter="url(#nodeGlow)"/>
    <circle class="dynamic-node" cx="1060" cy="110" r="6" fill="#ec4899" filter="url(#nodeGlow)" style="animation-delay: 1.5s;"/>
  </g>

  <!-- Floating Particles in Background -->
  <circle class="particle-1" cx="890" cy="180" r="3" fill="#38bdf8"/>
  <circle class="particle-2" cx="970" cy="90" r="2.5" fill="#c084fc"/>
  <circle class="particle-3" cx="1110" cy="270" r="3.5" fill="#f43f5e"/>
  <circle class="particle-1" cx="760" cy="90" r="2" fill="#38bdf8"/>

  <!-- Outer Elegant Border -->
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="url(#accentGrad1)" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- FOREGROUND CONTENT: Guaranteed crystal clear and on top -->
  <g transform="translate(60, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 48)">
      <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="16" cy="15" r="5" fill="#38bdf8"/>
      <text x="30" y="20" class="tag-text">🕷️ WEB EXTRACTION ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="128" class="title-text">Awesome Web Scraping &amp; Crawling</text>

    <!-- Subtitle -->
    <text x="0" y="168" class="subtitle-text">Curated SaaS Platforms, Distributed Crawlers, Headless Browsers &amp; AI Extraction Engines</text>

    <!-- Decorative Divider Line -->
    <line x1="0" y1="192" x2="680" y2="192" stroke="url(#accentGrad1)" stroke-width="2" stroke-opacity="0.8"/>

    <!-- Dynamic Feature Pills (Foreground) -->
    <g transform="translate(0, 222)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="36" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
        <text x="14" y="23" class="pill-text">🚀 Distributed Crawlers</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(142, 0)">
        <rect width="138" height="36" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
        <text x="14" y="23" class="pill-text">🤖 AI Agent Extraction</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(292, 0)">
        <rect width="144" height="36" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
        <text x="14" y="23" class="pill-text">🛡️ Anti-Bot &amp; Proxies</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(448, 0)">
        <rect width="148" height="36" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
        <text x="14" y="23" class="pill-text">🌐 Headless Automation</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(608, 0)">
        <rect width="130" height="36" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
        <text x="14" y="23" class="pill-text">⚡ High-Speed DOM</text>
      </g>
    </g>

    <!-- Bottom Metadata Info -->
    <g transform="translate(0, 290)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">
        ⭐ Production-Ready • 📊 Benchmark Tested • 🔄 Continuously Updated • 💡 Open Source &amp; Enterprise
      </text>
    </g>
  </g>
</svg>
